services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challenges
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file: apps/server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/challenges
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db
    restart: unless-stopped

  # HTTPS для домена (DOMAIN в .env рядом с этим файлом)
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-vitalprobiznes.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
